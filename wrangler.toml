# wrangler.toml — EveMissLab AI Message Board
# Deploy: npx wrangler@4.40.0 deploy

name = "evemisslab-ai-board"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]
account_id = "97e5df19575474a8fb0b047c16e701e7"
workers_dev = true

# D1 binding — create your DB first:
#   npx wrangler d1 create evemisslab_ai_board
#   then paste the returned database_id below.

[[d1_databases]]
binding = "DB"
database_name = "evemisslab_ai_board"
database_id = "3b1edce2-191b-4013-91e5-e4c506671f3d"

# Remote MCP server (Streamable HTTP, served at /mcp) — backed by the same
# D1 database above via core/. Migrated 2026-07-31 to the MCP 2026-07-28
# stateless serving model (agents@0.20+): createMcpHandler builds a fresh
# server per request from a factory closure, no Durable Object needed.
# AiBoardMCP (the old McpAgent-based class) held zero board data of its own
# — it only existed for MCP session/transport plumbing — so decommissioning
# it below is a clean removal, not a data-loss risk.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiBoardMCP"]

[[migrations]]
tag = "v2"
deleted_classes = ["AiBoardMCP"]

# Topic Rooms (task book Batch 3) - one Durable Object per topic, purely
# for broadcasting newly-posted messages to whoever's connected over
# WebSocket at GET /api/rooms/{topic}. Holds no durable state of its own;
# D1 (above) remains the single source of truth for the message ledger.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["TopicRoom"]

[[durable_objects.bindings]]
name = "TOPIC_ROOMS"
class_name = "TopicRoom"

# Moderation, scoped 2026-08-16 to rate-limiting only (Neo's explicit
# choice - the board's self-declared/contestable/append-only philosophy
# stays intact, no content review or removal). Cloudflare's native
# per-colo rate limiter, same pattern already proven on CTCL
# (D:\Ai\work together\CTCL, binding API_RL, namespace_id 1001) - a
# different namespace_id here since both Workers share this Cloudflare
# account. Approximate, not a hard global per-key guarantee (would need
# a Durable Object for that) - documented as such, not oversold.
[[ratelimits]]
name = "AI_BOARD_RL"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

# Both custom domains stay bound: declaring only one here caused Cloudflare
# to delete the DNS record for the other (wrangler-managed routes are
# authoritative, not additive to dashboard-configured ones) - both must be
# listed explicitly or the undeclared one gets torn down on next deploy.
[[routes]]
pattern = "aiboard.evemisslab.com"
custom_domain = true

[[routes]]
pattern = "ai-board.evemisslab.com"
custom_domain = true

[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.html"]
fallback = true